<style>
:root{--bg:#f4f7f5;--card:#fff;--tx:#1c2a26;--mu:#66786f;--bd:#dce5e0;--ac:#0f7b5f;--acx:#fff;--wr:#9a4a07;--wb:#fdf0d0;--dg:#b42318;--db:#fde4e1;--ok:#e3f3ec;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#111815;--card:#1a2420;--tx:#e8f0ed;--mu:#93a59e;--bd:#2c3a35;--ac:#3ec79d;--acx:#06251c;--wr:#fbbf24;--wb:#3a2e0e;--dg:#ff8a80;--db:#3d1816;--ok:#173128;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#111815;--card:#1a2420;--tx:#e8f0ed;--mu:#93a59e;--bd:#2c3a35;--ac:#3ec79d;--acx:#06251c;--wr:#fbbf24;--wb:#3a2e0e;--dg:#ff8a80;--db:#3d1816;--ok:#173128;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.w{max-width:720px;margin:0 auto;padding:14px 14px 90px}
h1{font-size:20px;margin:4px 0 12px}
.kp{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-bottom:12px}
.k{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:10px;text-align:center}
.k b{display:block;font-size:22px}.k span{font-size:12px;color:var(--mu)}
.tabs{display:flex;gap:6px;margin-bottom:10px}
.tabs button,.ch{flex:1;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:10px;padding:10px;font:inherit;font-weight:600;cursor:pointer}
.tabs button.on,.ch.on{background:var(--ac);color:var(--acx);border-color:var(--ac)}
.tabs button{font-size:14px;padding:10px 2px}
input,select{width:100%;padding:11px;border:1px solid var(--bd);border-radius:10px;background:var(--card);color:var(--tx);font:inherit}
.row{display:flex;gap:6px;margin:8px 0}
.ch{font-size:13px;padding:8px;font-weight:500}
.it{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px;margin-bottom:8px;display:flex;gap:10px;align-items:center}
.it .i{flex:1;min-width:0;cursor:pointer}
.it .n{font-weight:600}.it .m{font-size:13px;color:var(--mu)}
.ph{width:52px;height:52px;border-radius:10px;object-fit:cover;background:var(--bg);border:1px solid var(--bd);flex:none;display:flex;align-items:center;justify-content:center;font-size:22px;overflow:hidden}.pp{width:96px;height:96px;font-size:34px}
.gh{font-size:13px;font-weight:700;color:var(--ac);text-transform:uppercase;letter-spacing:.04em;margin:14px 2px 6px}
.bd{display:inline-block;font-size:11px;font-weight:600;padding:2px 7px;border-radius:99px;margin:3px 4px 0 0}
.b1{background:var(--wb);color:var(--wr)}.b2{background:var(--db);color:var(--dg)}.b3{background:var(--ok);color:var(--ac)}
.q{display:flex;align-items:center;gap:6px}
.q button{width:36px;height:36px;border-radius:10px;border:1px solid var(--bd);background:var(--bg);color:var(--tx);font-size:20px;cursor:pointer}
.q b{min-width:30px;text-align:center;font-size:18px}
.bt{background:var(--ac);color:var(--acx);border:0;border-radius:10px;padding:10px 14px;font:inherit;font-weight:600;cursor:pointer}
.bt.g{background:var(--bg);color:var(--tx);border:1px solid var(--bd)}.bt.d{background:var(--db);color:var(--dg)}
.fab{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));box-shadow:0 4px 14px #0004;padding:14px 18px;border-radius:99px}
.em{text-align:center;color:var(--mu);padding:30px 0}
dialog{border:1px solid var(--bd);border-radius:14px;background:var(--card);color:var(--tx);width:min(92vw,420px);padding:16px}
dialog::backdrop{background:#0006}
label{display:block;font-size:13px;color:var(--mu);margin:10px 0 4px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.phd{display:none}
@media print{
  :root:root:root{--bg:#fff;--card:#fff;--tx:#000;--mu:#444;--bd:#bbb;--ac:#0b6b52;--wb:#fff;--wr:#8a4206;--db:#fff;--dg:#b42318;--ok:#fff;color-scheme:light}
  .tabs,.row,.fab,h1,button{display:none!important}
  .phd{display:block;font-weight:700;font-size:18px;margin:0 0 12px}
  .w{max-width:none;padding:0}
  .it,.k{break-inside:avoid}
  body{background:#fff}
}
</style>
</head>
<body>
<div class="w">
  <h1 style="margin-bottom:4px">💊 Stock Pharmacie</h1>
  <div class="row" id="hb" style="align-items:center;margin:0 0 10px"><span id="sy" style="flex:1;font-size:12px;color:var(--mu)">Mode local (non synchronisé)</span><button class="bt g" id="pr" style="padding:6px 10px;font-size:13px">🖨 Imprimer</button><button class="bt g" id="rp" hidden style="padding:6px 10px;font-size:13px">⬇ Rapport</button></div>
  <div class="phd" id="ph"></div>
  <div class="kp" id="kp"></div>
  <div class="em" id="wn" hidden style="color:var(--dg);padding:0 0 10px">Mémoire pleine : les dernières modifications ne sont pas enregistrées. Supprimez des photos.</div>
  <div class="tabs"><button id="t1" class="on">Stock</button><button id="t2">À commander</button><button id="t3">Ventes</button><button id="t4">Dépenses</button></div>
  <div id="v1">
    <input id="s" type="search" placeholder="Rechercher un produit, fournisseur…">
    <div class="row"><select id="gs"></select><button class="bt g" id="gm">Groupes</button></div>
    <div class="row"><button class="ch on" data-f="all">Tous</button><button class="ch" data-f="low">Stock bas</button><button class="ch" data-f="exp">Péremption</button></div>
    <div id="l1"></div>
  </div>
  <div id="v4" hidden>
    <div class="tabs"><button class="pe" data-p="d">Jour</button><button class="pe" data-p="w">Semaine</button><button class="pe on" data-p="m">Mois</button></div>
    <div class="row" style="align-items:center"><button class="bt g" id="pe0">‹</button><b id="elab" style="flex:1;text-align:center"></b><button class="bt g" id="pe1">›</button></div>
    <div class="kp" id="ekp"></div>
    <div id="ecat"></div>
    <div id="el"></div>
  </div>
  <div id="v3" hidden>
    <div class="tabs"><button class="pd on" data-p="d">Jour</button><button class="pd" data-p="w">Semaine</button><button class="pd" data-p="m">Mois</button></div>
    <div class="row" style="align-items:center"><button class="bt g" id="pv0">‹</button><b id="plab" style="flex:1;text-align:center"></b><button class="bt g" id="pv1">›</button></div>
    <div class="kp" id="skp"></div>
    <div id="bars"></div>
    <div id="sl"></div>
  </div>
  <div id="v2" hidden>
    <div id="l2"></div><div class="em" id="tot" style="padding:6px 0"></div>
    <div class="row"><button class="bt g" id="cp" style="width:100%">Copier la liste de commande</button></div>
  </div>
</div>
<button class="bt fab" id="add">+ Produit</button>
<button class="bt fab" id="addv" hidden>+ Vente</button>
<button class="bt fab" id="addx" hidden>+ Dépense</button>

<dialog id="xd">
  <b>Nouvelle dépense</b>
  <label>Catégorie</label><select id="ec"></select>
  <label>Ou une nouvelle catégorie (ex. Assurance, Salaires…)</label><input id="en" placeholder="Laisser vide pour utiliser la liste">
  <div class="g2"><div><label>Montant (€)</label><input id="ea" type="number" min="0" step="0.01"></div><div><label>Date</label><input id="ed" type="date"></div></div>
  <label>Note (facultatif)</label><input id="enote">
  <div class="row" style="margin-top:16px"><button class="bt g" id="ex" style="flex:1">Annuler</button><button class="bt" id="esv" style="flex:1">Enregistrer</button></div>
</dialog>

<dialog id="sd">
  <b>Nouvelle vente</b>
  <label>Produit</label><select id="sp"></select>
  <div class="g2"><div><label>Quantité</label><input id="sq" type="number" min="1" value="1"></div><div><label>Prix unitaire (€)</label><input id="su" type="number" min="0" step="0.01"></div></div>
  <div id="si" style="font-size:13px;color:var(--wr);margin-top:8px;min-height:18px"></div>
  <div class="row" style="margin-top:12px"><button class="bt g" id="sx" style="flex:1">Annuler</button><button class="bt" id="ssv" style="flex:1">Enregistrer</button></div>
</dialog>

<dialog id="gd">
  <b>Gérer les groupes</b>
  <div class="row" style="margin-top:12px"><input id="gn" placeholder="Nouveau groupe"><button class="bt" id="ga">Ajouter</button></div>
  <div id="glist" style="max-height:50vh;overflow:auto"></div>
  <div class="row"><button class="bt g" id="gx" style="width:100%">Fermer</button></div>
</dialog>

<dialog id="dg">
  <b id="dt">Produit</b>
  <label>Nom</label><input id="fn">
  <label>Photo</label><div class="row" style="align-items:center"><div class="ph pp" id="pv">📷</div><div style="flex:1"><input id="fp" type="file" accept="image/*"><button class="bt g" id="fpx" style="margin-top:6px">Retirer la photo</button></div></div>
  <div class="g2"><div><label>Groupe</label><input id="fc" list="gl" placeholder="ex. Antibiotiques"><datalist id="gl"></datalist></div><div><label>Fournisseur</label><input id="fs"></div></div>
  <div class="g2"><div><label>Quantité</label><input id="fq" type="number" min="0"></div><div><label>Seuil d’alerte</label><input id="fm" type="number" min="0"></div></div>
  <div class="g2"><div><label>Prix d’achat (€)</label><input id="fb" type="number" min="0" step="0.01"></div><div><label>Prix de vente (€)</label><input id="fv" type="number" min="0" step="0.01"></div></div>
  <label>Date de péremption</label><input id="fe" type="date">

let per="d",off=0;
function range(){
  const n=new Date();let a,b;
  if(per==="d"){a=new Date(n.getFullYear(),n.getMonth(),n.getDate()+off);b=new Date(a.getFullYear(),a.getMonth(),a.getDate()+1)}
  else if(per==="w"){const wd=(n.getDay()+6)%7;a=new Date(n.getFullYear(),n.getMonth(),n.getDate()-wd+off*7);b=new Date(a.getFullYear(),a.getMonth(),a.getDate()+7)}
  else{a=new Date(n.getFullYear(),n.getMonth()+off,1);b=new Date(a.getFullYear(),a.getMonth()+1,1)}
  return [a,b];
}
function rSales(){
  const [a,b]=range(),e=new Date(b.getFullYear(),b.getMonth(),b.getDate()-1);
  const L=S.s.filter(s=>{const d=new Date(s.t);return d>=a&&d<b}).sort((x,y)=>y.t.localeCompare(x.t));
  document.querySelectorAll(".pd").forEach(x=>x.classList.toggle("on",x.dataset.p===per));
  const lab=per==="d"?a.toLocaleDateString("fr-FR",{weekday:"long",day:"numeric",month:"long",year:"numeric"}):per==="w"?"Du "+a.toLocaleDateString("fr-FR",{day:"numeric",month:"short"})+" au "+e.toLocaleDateString("fr-FR",{day:"numeric",month:"short",year:"numeric"}):a.toLocaleDateString("fr-FR",{month:"long",year:"numeric"});
  $("plab").textContent=lab.replace(/^./,c=>c.toUpperCase());
  const ca=L.reduce((s,x)=>s+x.q*x.v,0),mg=L.reduce((s,x)=>s+x.q*(x.v-x.b),0),ar=L.reduce((s,x)=>s+x.q,0);
  $("skp").innerHTML='<div class="k"><b>'+eur(ca)+'</b><span>Chiffre d’affaires</span></div><div class="k"><b>'+eur(mg)+'</b><span>Marge</span></div><div class="k"><b>'+ar+'</b><span>Articles vendus</span></div><div class="k"><b>'+L.length+'</b><span>Ventes</span></div>';
  let h="";
  if(per!=="d"){
    const n=per==="w"?7:e.getDate(),A=Array(n).fill(0),W=["L","M","M","J","V","S","D"];
    L.forEach(x=>{const d=new Date(x.t),i=per==="w"?Math.round((new Date(d.getFullYear(),d.getMonth(),d.getDate())-a)/864e5):d.getDate()-1;if(A[i]!==undefined)A[i]+=x.q*x.v});
    const mx=Math.max(...A,1);
    h='<div class="k" style="margin-bottom:12px"><div style="display:flex;align-items:flex-end;gap:3px;height:100px">'+A.map(v=>'<div title="'+eur(v)+'" style="flex:1;height:'+Math.max(2,Math.round(v/mx*100))+'px;background:var(--ac);border-radius:4px 4px 0 0;opacity:'+(v?1:.25)+'"></div>').join("")+'</div><div style="display:flex;gap:3px;font-size:11px;color:var(--mu);margin-top:4px">'+A.map((v,i)=>'<div style="flex:1;text-align:center">'+(per==="w"?W[i]:((i+1)%5===0||i===0?i+1:""))+'</div>').join("")+'</div></div>';
  }
  $("bars").innerHTML=h;
  const T={};L.forEach(x=>{const r=T[x.n]||(T[x.n]={q:0,c:0});r.q+=x.q;r.c+=x.q*x.v});
  const top=Object.entries(T).sort((x,y)=>y[1].q-x[1].q).slice(0,5);
  const tp=top.length?'<div class="gh">Produits les plus vendus</div>'+top.map(([n,r])=>'<div class="it"><div class="i"><div class="n">'+esc(n)+'</div></div><div><b>'+r.q+'</b> <span class="m">· '+eur(r.c)+'</span></div></div>').join(""):"";
  $("sl").innerHTML=L.length?tp+'<div class="gh">Détail des ventes</div>'+L.slice(0,50).map(x=>'<div class="it"><div class="i"><div class="n">'+esc(x.n)+' × '+x.q+'</div><div class="m">'+new Date(x.t).toLocaleString("fr-FR",{day:"2-digit",month:"2-digit",hour:"2-digit",minute:"2-digit"})+' · '+eur(x.q*x.v)+'</div></div><button class="bt g" data-sd="'+esc(x.id)+'">✕</button></div>').join("")+(L.length>50?'<div class="em">+ '+(L.length-50)+' autres ventes</div>':""):'<div class="em">Aucune vente sur cette période</div>';
}

}

  const cc=S.xc.find(x=>x.toLowerCase()===c.toLowerCase());
  const dv=$("ed").value,t=dv?new Date(dv+"T12:00:00"):new Date(),n=new Date();
  S.x.push({id:Date.now()+"-"+Math.random().toString(36).slice(2,6),t:t.toISOString(),c:cc,a:Math.round(a*100)/100,n:$("enote").value.trim()});
  save();$("xd").close();ep="m";eo=(t.getFullYear()-n.getFullYear())*12+t.getMonth()-n.getMonth();render();
};
/* ===== Synchronisation en ligne ===== */
let DB=null,DLD=null,TO=null,syncOK=false,pushing=false,again=false,retry=0;
const PV={products:{},sales:{},expenses:{},meta:""},RD={},PQ={},CK={products:"p",sales:"s",expenses:"x"};
const js=o=>JSON.stringify(o,Object.keys(o).sort());
const cl=o=>JSON.parse(JSON.stringify(o));
const setSy=(t,c)=>{const e=$("sy");e.textContent=t;e.style.color=c||"var(--mu)"};
async function pushOnce(){
  for(const c in CK){
    const cur={};S[CK[c]].forEach(o=>{cur[String(o.id)]=o});
    for(const id in cur){const j=js(cur[id]);if(PV[c][id]!==j){await DB.doc(c+"/"+id).set(cl(cur[id]));PV[c][id]=j}}
    for(const id in PV[c]){if(!(id in cur)){await DB.doc(c+"/"+id).delete();delete PV[c][id]}}
  }
  const m={g:S.g,xc:S.xc},j=js(m);
  if(PV.meta!==j){await DB.doc("meta/main").set(cl(m));PV.meta=j}
}
async function pushSync(){
  if(!DB||!syncOK)return;
  if(pushing){again=true;return}
  pushing=true;
  try{
    do{again=false;await pushOnce()}while(again);
    retry=0;setSy("☁ Synchronisé","var(--ac)");
  }catch(e){
    if(e&&e.code==="invalid_argument")setSy("Modifications non enregistrées en ligne (accès en lecture seule ?)","var(--wr)");
    else{setSy("Synchronisation en attente…","var(--wr)");if(retry++<5)setTimeout(pushSync,4000)}
  }
  pushing=false;
  const q=Object.assign({},PQ);for(const k in PQ)delete PQ[k];
  for(const k in q){if(k==="meta")onMeta(q[k]);else onCol(k,q[k])}
}
function ready(){
  if(syncOK||Object.keys(RD).length<4)return;
  syncOK=true;clearTimeout(TO);setSy("☁ Synchronisé","var(--ac)");pushSync();
}
function onCol(c,snap){
  if(pushing){PQ[c]=snap;return}
  const k=CK[c],R={},ids=[];
  snap.docs.forEach(d=>{R[d.id]=d.data();ids.push(d.id)});
  const keep=(S.seed&&!S.sy[c]&&ids.length)?[]:S[k].filter(o=>{const i=String(o.id);return !(i in R)&&!(i in PV[c])});
  S[k]=ids.map(i=>cl(R[i])).concat(keep);
  S.sy[c]=1;PV[c]={};ids.forEach(i=>{PV[c][i]=js(R[i])});
  RD[c]=1;persist();render();ready();
}
function onMeta(snap){
  if(pushing){PQ.meta=snap;return}
  const d=snap.exists?snap.data():null;
  if(d){
    const rg=d.g||[],rx=d.xc||[];
    if(!S.sy.meta){S.g=[...new Set([...rg,...S.g])];S.xc=[...new Set([...rx,...S.xc])]}
    else{S.g=cl(rg);S.xc=cl(rx)}
    PV.meta=js({g:rg,xc:rx});
  }
  S.sy.meta=1;RD.meta=1;persist();render();ready();
}
async function initSync(){
  try{
    if(!window.claude||!window.claude.use){$("rp").hidden=false;setSy("Mode local (données enregistrées sur cet appareil)");return}
    const db=await window.claude.use("db");
    if(!db){setSy("Mode local (non synchronisé)");return}
    DB=db;setSy("Synchronisation…");
    TO=setTimeout(()=>{if(!syncOK)setSy("Synchronisation impossible pour l’instant (données locales)","var(--wr)")},10000);
    const er=e=>setSy("Synchronisation interrompue ("+((e&&e.code)||"erreur")+")","var(--dg)");
    for(const c in CK)DB.collection(c).onSnapshot(s=>onCol(c,s),er);
    DB.doc("meta/main").onSnapshot(onMeta,er);
    const dl=await window.claude.use("downloads");
    if(dl){DLD=dl;$("rp").hidden=false}
  }catch(e){setSy("Mode local (non synchronisé)")}
}
/* ===== Impression ===== */
const ptitle=()=>["Stock","Liste à commander","Ventes — "+$("plab").textContent,"Dépenses — "+$("elab").textContent][tab-1]+" · "+new Date().toLocaleDateString("fr-FR");
$("pr").onclick=()=>{$("ph").textContent=ptitle();try{window.print()}catch(e){}};
$("rp").onclick=async()=>{
    const t=ptitle(),ids=[["kp","l1"],["l2","tot"],["skp","bars","sl"],["ekp","ecat","el"]][tab-1];
  const body=ids.map(i=>$(i).outerHTML).join("").replace(/<button[\s\S]*?<\/button>/g,"");
  const html='<!DOCTYPE html><html lang="fr" data-theme="light"><head><meta charset="utf-8"><title>'+esc(t)+'</title><style>'+document.querySelector("style").textContent+'</style></head><body><div class="w"><h1>'+esc(t)+'</h1>'+body+'</div></body></html>';
  const fn="rapport-"+["stock","commandes","ventes","depenses"][tab-1]+".html";
  try{if(DLD)await DLD.save({filename:fn,data:html});else{const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([html],{type:"text/html"}));a.download=fn;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1000)}}catch(e){}
};
initSync();
$("kp").onclick=ev=>{if(ev.target.closest("#kv")){S.vm=S.vm==="v"?"t":S.vm==="t"?"a":"v";save();render()}};
$("cp").onclick=async()=>{
  const L=S.p.filter(p=>low(p)&&!p.o);
  const t=L.length?L.map(p=>"- "+p.n+" × "+sug(p)+" ("+(p.s||"fournisseur ?")+")").join("\n"):"Rien à commander";
  try{await navigator.clipboard.writeText(t);$("cp").textContent="Copié ✓"}catch(e){$("cp").textContent="Copie impossible"}
  setTimeout(()=>$("cp").textContent="Copier la liste de commande",1800);
};
render();
</script>
